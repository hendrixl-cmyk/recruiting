<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { font-family: Arial, sans-serif; font-size: 13px; margin: 10px; color: #202124; }
    .card { border: 1px solid #dadce0; border-radius: 8px; padding: 10px; margin-bottom: 12px; }
    .name { font-weight: bold; font-size: 14px; }
    .sub { color: #5f6368; margin: 2px 0 6px; }
    .about { background: #f1f3f4; border-radius: 4px; padding: 6px; margin: 6px 0; font-size: 12px; }
    label { display: block; font-size: 11px; color: #5f6368; margin-top: 8px; }
    textarea { width: 100%; box-sizing: border-box; font: inherit; border: 1px solid #dadce0; border-radius: 4px; padding: 6px; }
    .count { font-size: 11px; color: #5f6368; text-align: right; }
    .count.over { color: #d93025; font-weight: bold; }
    .row { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
    button, a.btn { font: inherit; padding: 5px 10px; border-radius: 4px; border: 1px solid #dadce0; background: #fff; cursor: pointer; text-decoration: none; color: #202124; }
    .primary { background: #0a66c2; color: #fff !important; border-color: #0a66c2; }
    .done { background: #188038; color: #fff; border-color: #188038; }
    .help { color: #5f6368; font-size: 12px; margin-bottom: 10px; }
    #empty { color: #5f6368; }
  </style>
</head>
<body>
  <div class="help">
    For each person: open their profile, click <b>Connect → Add a note</b>, paste the note, send.
    When they accept, paste the longer message into a DM. Then click <b>I sent it</b> so it's logged.
  </div>
  <div id="list">Loading…</div>

  <script>
    var NOTE_LIMIT = 300;

    function load() {
      google.script.run.withSuccessHandler(render).withFailureHandler(showError).getLinkedInQueue();
    }

    function render(items) {
      var list = document.getElementById('list');
      list.innerHTML = '';
      if (!items.length) {
        list.innerHTML = '<div id="empty">Nothing waiting. Set a row\'s Status to "Approved" (Channel = LinkedIn or Both) to see it here.</div>';
        return;
      }
      items.forEach(function (it) {
        var card = document.createElement('div');
        card.className = 'card';
        card.innerHTML =
          '<div class="name"></div><div class="sub"></div>' +
          (it.about ? '<div class="about"></div>' : '') +
          '<div class="row"><a class="btn primary" target="_blank" rel="noopener">Open LinkedIn profile</a></div>' +
          '<label>Connection note</label><textarea rows="4" class="note"></textarea><div class="count"></div>' +
          '<div class="row"><button class="copyNote">Copy note</button></div>' +
          '<label>Message after they accept</label><textarea rows="6" class="msg"></textarea>' +
          '<div class="row"><button class="copyMsg">Copy message</button></div>' +
          '<div class="row"><button class="done sent">I sent it</button><button class="skip">Skip</button></div>';
        card.querySelector('.name').textContent = it.name;
        card.querySelector('.sub').textContent = [it.title, it.company].filter(Boolean).join(' @ ');
        if (it.about) card.querySelector('.about').textContent = it.about;
        card.querySelector('a.btn').href = it.url;
        var note = card.querySelector('.note'), msg = card.querySelector('.msg'), count = card.querySelector('.count');
        note.value = it.note; msg.value = it.message;
        var updateCount = function () {
          count.textContent = note.value.length + ' characters (free accounts: 200, Premium: 300)';
          count.className = 'count' + (note.value.length > NOTE_LIMIT ? ' over' : '');
        };
        note.addEventListener('input', updateCount); updateCount();
        card.querySelector('.copyNote').onclick = function () { copy(note, this); };
        card.querySelector('.copyMsg').onclick = function () { copy(msg, this); };
        card.querySelector('.sent').onclick = function () { mark(it.row, 'sent', note.value, card); };
        card.querySelector('.skip').onclick = function () { mark(it.row, 'skip', note.value, card); };
        list.appendChild(card);
      });
    }

    function copy(textarea, btn) {
      var done = function () { var t = btn.textContent; btn.textContent = 'Copied!'; setTimeout(function () { btn.textContent = t; }, 1500); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(textarea.value).then(done, function () { fallbackCopy(textarea); done(); });
      } else { fallbackCopy(textarea); done(); }
    }

    function fallbackCopy(textarea) { textarea.focus(); textarea.select(); document.execCommand('copy'); }

    function mark(row, action, note, card) {
      card.style.opacity = 0.4;
      google.script.run
        .withSuccessHandler(function () { card.remove(); if (!document.querySelector('.card')) load(); })
        .withFailureHandler(function (e) { card.style.opacity = 1; showError(e); })
        .markLinkedIn(row, action, note);
    }

    function showError(e) { alert('Something went wrong: ' + (e && e.message ? e.message : e)); }

    load();
  </script>
</body>
</html>
